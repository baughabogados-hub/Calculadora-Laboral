<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Acceso · Calculadora de Finiquito Baugh</title>
<meta name="theme-color" content="#111111">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="/baugh/manifest.webmanifest">
<link rel="apple-touch-icon" href="/baugh/icons/apple-touch-icon.png">
<link rel="icon" href="/baugh/icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;0,700;1,400&display=swap">
<style>
  :root {
    --ink: #111111; --ink-soft: #3a3a3a; --ink-faint: #767676;
    --paper: #f5f5f3; --paper-raised: #ffffff; --line: #dadad6;
    --danger: #9b2c22; --focus: #5a5a5a; --logo-filter: none;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ink: #f2f2f0; --ink-soft: #c8c8c4; --ink-faint: #8e8e8a;
      --paper: #0f0f0f; --paper-raised: #191919; --line: #333331;
      --danger: #e08a7e; --focus: #bdbdbd; --logo-filter: invert(1);
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: var(--paper); color: var(--ink);
    font-family: "Lora", Georgia, "Times New Roman", serif;
    display: grid; place-items: center;
    padding: max(24px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
    min-height: 100vh;
  }
  main {
    width: 100%; max-width: 400px;
    background: var(--paper-raised); border: 1px solid var(--line); border-radius: 10px;
    padding: 32px 28px 28px;
  }
  .logo { display: block; height: 52px; width: auto; margin: 0 0 28px; filter: var(--logo-filter); }
  h1 { font-size: 22px; font-weight: 600; margin: 0 0 6px; text-wrap: balance; }
  .sub { margin: 0 0 24px; color: var(--ink-soft); font-size: 14.5px; line-height: 1.5; }
  label { display: block; font-size: 13px; font-weight: 600; color: var(--ink-soft); margin-bottom: 6px; }
  input {
    width: 100%; font: inherit; font-size: 16px; color: var(--ink);
    background: var(--paper); border: 1px solid var(--line); border-radius: 6px; padding: 11px 12px;
  }
  input:focus, button:focus-visible, a:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  button {
    margin-top: 16px; width: 100%; font: inherit; font-weight: 700; font-size: 15px;
    color: var(--paper-raised); background: var(--ink); border: 0; border-radius: 7px; padding: 12px 18px; cursor: pointer;
  }
  .error { color: var(--danger); font-size: 14px; margin: 0 0 16px; }
  .alt { margin: 22px 0 0; padding-top: 18px; border-top: 1px solid var(--line); font-size: 13px; color: var(--ink-faint); line-height: 1.5; }
  [hidden] { display: none !important; }
  footer { margin-top: 18px; text-align: center; font-size: 11.5px; color: var(--ink-faint); }
</style>
</head>
<body>
<div>
<main>
  <img class="logo" src="/baugh/icons/logo-baugh.png" alt="Baugh Abogados">
  <h1>Calculadora de Finiquito</h1>
  <p class="sub">Herramienta interna del equipo de Baugh Abogados.</p>
  {{ERROR}}
  <form method="post" action="/baugh/login" {{PASSWORD_FORM}}>
    <label for="password">Contraseña del equipo</label>
    <input type="password" id="password" name="password" autocomplete="current-password" required autofocus>
    <button type="submit">Entrar</button>
  </form>
  <p class="sub" {{SIN_PASSWORD}}>Entra desde El Castillo con tu usuario del despacho.</p>
  <p class="alt">¿Tienes cuenta en El Castillo? Abre la calculadora desde ahí y entras sin escribir contraseña.</p>
</main>
<footer>Tel: 33 1329 4195 · baugh.abogados@gmail.com</footer>
</div>
</body>
</html>
